syntax = "proto3";

package common.v1;

option go_package = "github.com/yaninyzwitty/temporal-durable-event-pipeline/gen/proto/common/v1;commonv1";

message PaginationRequest {
  int32 limit = 1;
  int32 offset = 2;
}

message PaginationResponse {
  int32 limit = 1;
  int32 offset = 2;
  int32 total = 3;
}
