syntax = "proto3";

package order.v1;

option go_package = "github.com/yaninyzwitty/temporal-durable-event-pipeline/gen/proto/order/v1;orderv1";

import "google/protobuf/timestamp.proto";

message Order {
  string id = 1;
  string user_id = 2;
  google.protobuf.Timestamp order_date = 3;
  string status = 4;
  double total_amount = 5;
}

message OrderItem {
  string id = 1;
  string order_id = 2;
  string product_id = 3;
  int32 quantity = 4;
  double unit_price = 5;
}

message CreateOrderRequest {
  string user_id = 1;
  double total_amount = 2;
}

message CreateOrderResponse {
  Order order = 1;
}

message GetOrderRequest {
  string id = 1;
}

message GetOrderResponse {
  Order order = 1;
}

message ListOrdersByUserRequest {
  string user_id = 1;
}

message ListOrdersByUserResponse {
  repeated Order orders = 1;
}

message UpdateOrderStatusRequest {
  string id = 1;
  string status = 2;
}

message UpdateOrderStatusResponse {
  Order order = 1;
}

message DeleteOrderRequest {
  string id = 1;
}

message DeleteOrderResponse {}

message CreateOrderItemRequest {
  string order_id = 1;
  string product_id = 2;
  int32 quantity = 3;
  double unit_price = 4;
}

message CreateOrderItemResponse {
  OrderItem order_item = 1;
}

message GetOrderItemsRequest {
  string order_id = 1;
}

message GetOrderItemsResponse {
  repeated OrderItem order_items = 1;
}

message UpdateOrderItemQuantityRequest {
  string id = 1;
  int32 quantity = 2;
}

message UpdateOrderItemQuantityResponse {
  OrderItem order_item = 1;
}

message DeleteOrderItemRequest {
  string id = 1;
}

message DeleteOrderItemResponse {}
