# .github/workflows/lint.yml - Reusable lint workflow
name: Lint

on:
  workflow_call:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    env:
      GOTOOLCHAIN: local

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Ensure go.mod and go.sum are clean and reproducible
      - name: Verify dependencies (go mod tidy)
        run: |
          go mod tidy
          if [ -n "$(git diff -- go.mod go.sum)" ]; then
            echo "go.mod or go.sum was modified:"
            git diff -- go.mod go.sum
            exit 1
          fi

      # Run golangci-lint using the same Go toolchain (avoids version mismatch)
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          install-mode: goinstall
          args: --timeout=5m --config=.golangci.yml
